<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla</title>
    <!-- Google Fonts (Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS файлына сілтеме -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header (Сайттың шапкасы) -->
    <header class="header">
        <div class="container">
            <nav class="nav">
                <!-- Логотип -->
                <div class="logo">
                    <a href="#">
                        <svg class="logo-svg" viewBox="0 0 342 35" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0 .1a9.7 9.7 0 007 7h11l.5.1v27.6h11.5V7.2l.5-.1h11a9.7 9.7 0 007-7H0zm68.6 0l-.2 6.2h18.2s.3 2.8 0 3.5h-18l-.5 6.4h17.5s.3 2.8 0 3.5h-17l-.5 8.1h18.3s1.6 0 1.9-1.8c.8-4.2 2.2-14 2.2-14s.3-2.1-1.3-2.6c1.6-.6 1.5-2.3 1.5-2.3s-.2-4.5-2.7-6.2c-1.8-1.2-4.1-1-4.1-1H68.6zm51.4 0c-3 0-5.3 1.3-6.2 3.8l-1 2.8h11.4l.2-1.3h5.9l.2 1.3h11.5l-1-2.8c-1-2.5-3.2-3.8-6.2-3.8h-14.8zm-5.7 13.5c-.8 3.8-2 13.8-2 13.8s-.3 2.4 1.8 2.4h22.2s2.1 0 1.8-2.4c-.2-1.1-2-13.8-2-13.8h-21.8zM184 0a9.7 9.7 0 007 7h11l.5.1v27.6h11.5V7.2l.5-.1h11a9.7 9.7 0 007-7H184zm65.1 0l-12 34.8h11.6l2.3-7.5h11.2l2.3 7.5h11.6L264.3 0h-15.2zm2 10.3l3.8 11.7h-7.6l3.8-11.7z" fill="currentColor"/>
                        </svg>
                    </a>
                </div>

                <!-- Меню тізімі -->
                <ul class="menu">
                    <li><a href="#" class="menu__item active">Model S</a></li>
                    <li><a href="#" class="menu__item">Model 3</a></li>
                    <li><a href="#" class="menu__item">Model X</a></li>
                    <li><a href="#" class="menu__item">Model Y</a></li>
                    <li><a href="#" class="menu__item">Solar Roof</a></li>
                    <li><a href="#" class="menu__item">Solar Panels</a></li>
                </ul>

                <!-- Оң жақ меню -->
                <div class="right-menu">
                    <a href="#" class="menu__item">Shop</a>
                    <a href="#" class="menu__item">Account</a>
                    <a href="#" class="menu__item">Menu</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Section (Басты бөлім - Model S) -->
    <main class="main">
        <section class="hero">
            <div class="hero__content">
                <h1 class="hero__title">Model S</h1>
                <p class="hero__subtitle">Order Online for <a href="#">Touchless Delivery</a></p>
            </div>

            <!-- Батырмалар және сипаттамалар -->
            <div class="hero__footer">
                <div class="specs">
                    <div class="spec__item">
                        <h2>396 mi</h2>
                        <p>Range (EPA est.)</p>
                    </div>
                    <div class="spec__item">
                        <h2>1.99 s</h2>
                        <p>0-60 mph*</p>
                    </div>
                    <div class="spec__item">
                        <h2>200 mph</h2>
                        <p>Top Speed</p>
                    </div>
                    <div class="spec__item">
                        <h2>1,020 hp</h2>
                        <p>Peak Power</p>
                    </div>
                </div>

                <div class="buttons">
                    <a href="#" class="btn btn--primary">Custom Order</a>
                    <a href="#" class="btn btn--secondary">Existing Inventory</a>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
